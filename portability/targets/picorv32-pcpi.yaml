# PicoRV32 Pico Co-Processor Interface (PCPI) — target capability model.
# schema_version: 1 (see docs/target-capability-model.md)

schema_version: 1
target: picorv32-pcpi
description: "PicoRV32 external PCPI coprocessor interface."
status: working

architecture:
  xlen: [32]

interface:
  name: pcpi
  operands:
    inputs_native: [rs1, rs2]
    inputs_adapter: [rd]   # bound to port pcpi_rsd
    outputs: [rd]
  variable_latency: true
  stall: true              # pcpi_wait
  ready: true              # pcpi_ready
  memory_access: false
  exceptions: limited      # illegal insn if no PCPI ack within 16 cycles
  custom_state: false
  max_ack_cycles_without_wait: 16
  start_is_pulse: false

implementation:
  language: verilog
  adapter_backend: pcpi
  reference_core: YosysHQ/picorv32

adapter_notes: |
  For instructions whose semantics read `rd`, the generated PCPI module exposes
  `pcpi_rsd` (current destination register value). Integrating with stock
  PicoRV32 requires forwarding `cpuregs[rd]` onto that port when pcpi_valid is
  high. The differential tests drive a PCPI bus-functional model that supplies
  pcpi_rsd — validating the coprocessor + handshake bit-exactly. Full-core
  integration is a separate, documented one-line RF tap.
