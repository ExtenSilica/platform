# Reference interpreter — golden model (always available locally).
schema_version: 1
target: reference
description: "XSIL reference interpreter (golden model)."
status: working

architecture:
  xlen: [32]

interface:
  name: reference
  operands:
    inputs_native: [rd, rs1, rs2, rs3]
    inputs_adapter: []
    outputs: [rd]
  variable_latency: true
  stall: true
  ready: true
  memory_access: false
  exceptions: none
  custom_state: false
  max_ack_cycles_without_wait: null
  start_is_pulse: false

implementation:
  language: none
  adapter_backend: reference
  reference_core: extensilica/xsil_sem

adapter_notes: |
  Soft target. Supplies every MVP register operand; used by `xsil-port test
  --target reference`. No RTL is generated.
