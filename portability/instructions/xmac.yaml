# XMAC — multiply-accumulate: rd = rd + rs1 * rs2
# Experimental XSIL semantic description (single source of truth for behavior).
instruction: xmac
description: "Multiply-accumulate into rd: rd = rd + rs1 * rs2 (mod 2^32)."
xlen: 32

encoding:
  length: 32
  mask: 0xfe00707f      # funct7 | funct3 | opcode
  match: 0x0200000b     # custom-0 opcode 0x0b, funct3=0, funct7=0x01

operands:
  inputs: [rd, rs1, rs2]
  outputs: [rd]

overflow: wrap

effects:
  memory: none
  csr: none
  exceptions: none
  persistent_state: false

execution:
  latency: variable      # multiply may take several cycles on a small core
  may_stall: true

semantics:
  expression:
    add:
      - read: rd
      - mul:
          - read: rs1
          - read: rs2
