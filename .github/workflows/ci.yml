name: CI

# Runs on every push and pull request to catch build and lint regressions early.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"

jobs:
  # ── Anti-financial schema drift (PR-G8) ───────────────────────────────────────
  no-financial-drift:
    name: Policy — no financial schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run check-no-financial-drift.sh
        run: bash scripts/check-no-financial-drift.sh

  # ── XSIL smart contract (Foundry) ─────────────────────────────────────────────
  contracts-check:
    name: Contracts — forge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2

      - name: forge test
        run: forge test

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend — typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: store-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: ESLint (if configured)
        run: npx eslint . --ext .ts --max-warnings 0 || true
        # `|| true` so missing eslint config doesn't break CI; remove once configured

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: store-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Provide a stub API URL so Next.js doesn't fail on missing env var
      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

  # ── Portability engine (unit tests; no Icarus/GHDL) ───────────────────────────
  portability-check:
    name: Portability — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portability
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python3 -m pip install -r requirements.txt pytest

      - name: Unit tests
        run: python3 -m pytest tests/ -q
